[project]
name = "shopkb-backend"
version = "0.1.0"
description = "E-commerce product knowledge-base RAG Q&A system (LangChain)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20.0",
    "asyncmy>=0.2.9",
    "alembic>=1.13.0",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1.0",
    "PyJWT>=2.8.0",
    "redis>=5.0.0",
    "arq>=0.26.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "pymilvus>=2.5.0,<3.0",
    "milvus-lite>=2.4.0",
    "tenacity>=8.3.0",
    "structlog>=24.1.0",
    "httpx>=0.27.0",
    "msgpack>=1.0.8",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
rerank = ["sentence-transformers>=2.7.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
# E501: 行长是风格问题；B008: FastAPI 依赖注入惯用 Depends() 作默认参数
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
